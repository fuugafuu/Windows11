<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="theme-color" content="#000000"><meta name="description" content="Windows 11 inspired virtual PC: UEFI firmware and browser OS."><title>Virtual PC — UEFI / Windows 11</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="shell.css"><script src="app.js" defer></script></head><body>
<div class="workspace">
 <div class="toolbar" aria-label="管理操作"><button class="toolbar-button" id="btn-power" type="button">⏻</button><button class="toolbar-button" id="btn-help" type="button">?</button><button class="toolbar-button" id="btn-fullscreen" type="button">⛶</button></div>
 <main class="firmware" id="firmware" tabindex="-1" aria-label="仮想UEFI設定">
  <section class="firmware-title"><div><strong>Aptio Setup Utility</strong><span> - Virtual UEFI</span></div><div class="sim-indicator">VIRTUAL</div></section>
  <nav class="tabs" id="tabs" aria-label="UEFIメニュー"></nav>
  <section class="firmware-body" id="firmware-body"><div class="settings-column"><div class="location-line"><span id="breadcrumb">Main</span><span id="modified-pill" class="modified-pill" hidden>● UNSAVED</span></div><div class="settings-list" id="settings-list" role="listbox" aria-label="UEFI設定" tabindex="0"></div></div><aside class="context-panel" id="context-panel" aria-live="polite"><div class="help-heading">Item Specific Help</div><div class="context-content" id="context-content"></div><div class="key-legend"><div><b>← →</b> Select Screen</div><div><b>↑ ↓</b> Select Item</div><div><b>Enter</b> Select / Edit</div><div><b>F1</b> Help</div><div><b>F9</b> Defaults</div><div><b>F10</b> Save & Exit</div><div><b>Esc</b> Back</div></div></aside></section>
  <div class="firmware-footer"><span>Copyright © Virtual Firmware Lab</span><span id="status-message" role="status">Use arrow keys or tap to navigate</span><span>UEFI BIOS Utility</span></div>
 </main>
 <nav class="touch-keys" id="touch-keys" aria-label="スマホ用ファームウェアキー"><button data-key="ArrowLeft">◀</button><button data-key="ArrowUp">▲</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button><button data-key="Enter">ENTER</button><button data-key="Escape">ESC</button><button data-key="F2">F2</button><button data-key="F9">F9</button><button data-key="F10">F10</button></nav>
</div>
<div class="overlay" id="overlay" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-title" id="dialog-title"></div><div class="dialog-body" id="dialog-body"></div><div class="dialog-actions" id="dialog-actions"></div></div></div>
<template id="splash-template"><div class="screen-splash"><div class="splash-symbol">American Megatrends</div><h1>Virtual UEFI BIOS</h1><div class="splash-post">CPU: Virtual x64 Processor<br>Memory: 8192 MB<br>UEFI Firmware — Initializing devices...</div><p>Press DEL or F2 to enter Setup</p><div class="splash-actions"><button data-screen-action="setup">UEFI Setup [F2]</button><button data-screen-action="boot">Boot SSD [Enter]</button></div></div></template>
<script type="module" src="shell.js"></script></body></html>
